<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travellite extension icon</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#12343B}a:hover{color:#0A2126}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; padding: 64px; background: #F6F3EC; font-family: Manrope, system-ui, sans-serif; color: #12343B; display: flex; gap: 72px; align-items: center">

  <div style="display: flex; flex-direction: column; gap: 28px; align-items: flex-start">
    <svg width="360" height="360" viewBox="0 0 128 128" role="img" aria-label="Travellite icon: a paper plane finishing a check mark">
      <rect width="128" height="128" rx="28" fill="{{ground}}"></rect>
      <path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
      <g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.02em">Travellite</h1>
      <p style="margin: 0; font-size: 16px; font-weight: 500; color: #4A5D61">Plan the trip, check it off.</p>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 36px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5D61">Manifest sizes</p>
      <div style="display: flex; gap: 40px; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
          <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
          <span style="font-size: 13px; font-weight: 700; color: #4A5D61">128</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
          <svg width="48" height="48" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
          <span style="font-size: 13px; font-weight: 700; color: #4A5D61">48</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
          <svg width="32" height="32" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
          <span style="font-size: 13px; font-weight: 700; color: #4A5D61">32</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
          <svg width="16" height="16" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
          <span style="font-size: 13px; font-weight: 700; color: #4A5D61">16</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5D61">In the toolbar</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
        <div style="background: #FFFFFF; border: 1px solid #DDD8CC; border-radius: 12px; height: 72px; display: flex; align-items: center; gap: 18px; padding: 0 22px">
          <div style="flex: 1; height: 30px; border-radius: 15px; background: #EFEDE7"></div>
          <svg width="16" height="16" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
          <svg width="32" height="32" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
        </div>
        <div style="background: #202124; border-radius: 12px; height: 72px; display: flex; align-items: center; gap: 18px; padding: 0 22px">
          <div style="flex: 1; height: 30px; border-radius: 15px; background: #35363A"></div>
          <svg width="16" height="16" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
          <svg width="32" height="32" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="{{ground}}"></rect><path d="M28 66 L50 88 L88 44" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(94 38) rotate(-45) scale(1.15)"><path d="M24 0 L-14 -15 L-6 0 L-14 15 Z" fill="{{paper}}"></path></g></svg>
        </div>
      </div>
      <p style="margin: 0; font-size: 13px; font-weight: 500; color: #4A5D61">Shown at 16 px (1x) and 32 px (2x) on light and dark browser chrome.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#12343B","options":["#12343B","#1B2A4A","#2B2D42"]},"accent":{"editor":"color","default":"#F2A541","options":["#F2A541","#5EC2B7","#E86F51"]},"paper":{"editor":"color","default":"#F7F3EA"},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ground: this.props.ground ?? '#12343B',
      accent: this.props.accent ?? '#F2A541',
      paper: this.props.paper ?? '#F7F3EA'
    };
  }
}
</script>
</body>
</html>
